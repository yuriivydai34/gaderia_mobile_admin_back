name: Deploy to Gigacloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # migrations/ and scripts/ have to travel too: the schema is applied by
      # hand on the server, and the import is run from there.
      - name: Copy build and operational files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # package.json and package-lock.json have to travel as well: the next
          # step runs `npm ci` on the server, and without them it installs the
          # dependency set from whatever stale copy is already there. Shipping
          # dist/ alone once left the app unable to start, because a dependency
          # added in this commit was never installed.
          #
          # Comma separated on one line: the block form leaves a trailing blank
          # entry, which drone-scp turns into an empty archive.
          source: 'dist/,migrations/,scripts/,package.json,package-lock.json'
          target: ${{ secrets.APP_PATH }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.APP_PATH }}
            npm ci --omit=dev
            # Read-only: fails the deploy if migrations/ holds a file the
            # database has not had. Applying it stays a manual step - this
            # only makes forgetting impossible, which is what actually went
            # wrong twice before (a column in the model and not in the
            # database, every query to that table failing with 42703).
            node scripts/migrate.mjs --check
            pm2 restart ${{ secrets.PM2_APP_NAME }} || pm2 start dist/main.js --name ${{ secrets.PM2_APP_NAME }}
            pm2 save
