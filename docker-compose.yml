# Local development database. The application runs on PostgreSQL
# (src/app.module.ts, the pg driver) - this file used to start MySQL, which
# nothing here has ever connected to.
#
#   docker compose up -d
#   node scripts/dev-db-init.mjs      # create the schema from the entities
#
# Port 55432 on the host, so a PostgreSQL already installed locally on 5432 is
# left alone.

services:
  postgres:
    image: postgres:16
    container_name: gaderia-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DEV_DB_USER:-gaderia}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-devpass}
      POSTGRES_DB: ${DEV_DB_NAME:-gaderia_dev}
    ports:
      - "${DEV_DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Nothing should try to connect until the server is actually accepting
      # connections; the image restarts it once during first-time setup.
      test: ["CMD-SHELL", "pg_isready -U ${DEV_DB_USER:-gaderia} -d ${DEV_DB_NAME:-gaderia_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: gaderia-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
